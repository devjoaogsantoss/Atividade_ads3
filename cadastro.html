<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'> 
    <title>Document</title>
</head>
<body>

<form method="post">

<div class="container">
    <label><b>Cadastro</b></label> <br><br>
    <label for="nome">Nome Completo</label> <br>
    <input type="text" placeholder="Digite seu nome completo" name="nome" required> <br>

    <label for="data">Data de Nascimento</label> <br>
    <input type="date" name="data" required> <br>

    <label for="genero">Genero</label> <br>
    <select name="genero" required>
        <option value="">Selecione</option>
        <option value="masculino">Masculino</option>
        <option value="feminino">Feminino</option>
        <option value="outro1">Prefiro não informar</option>
        <option value="outro">Outro</option>
    </select> <br>

    <label for="email">Email</label> <br>
    <input type="email" placeholder="Digite seu endereço de email" name="email" required> <br>

    <label for="senha">Senha</label> <br>
    <input type="password" placeholder="Digite sua senha" name="senha" required> <br>

    <label for="confirmesenha">Confirmar Senha</label>
    <input type="password" placeholder="Confirme sua senha" name="confirmesenha" required> <br><br>
</div>

<div>
    <input type="checkbox" name="termos" required> 
    <label for="termos">Aceito os termos e condições</label>
    <br></br>

</div>

<div>
    <button type="submit">Cadastrar</button>
</div>

<p class="text_rodape" >Já possui uma conta? <a href="index.html">Faça login</a></p>

</form>


    
</body>
</html>
